name: Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and release, exactly matching package.json (for example v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the published release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: vintrace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind release to the dispatched tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Require exact immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Refuse published or populated release state
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '[.draft, (.assets | length)] | @tsv' 2>/dev/null || true)"
          if [ -n "$state" ]; then
            draft="${state%%$'\t'*}"
            assets="${state##*$'\t'}"
            test "$draft" = "true" || { echo "Refusing to mutate an already-published release." >&2; exit 1; }
            test "$assets" = "0" || { echo "Delete the populated failed draft before retrying; stale release assets are never overwritten." >&2; exit 1; }
          fi

  macos:
    name: Signed macOS payload
    needs: preflight
    uses: ./.github/workflows/macos-release.yml
    secrets: inherit

  windows:
    name: Signed Windows payload
    needs: preflight
    uses: ./.github/workflows/windows-release.yml
    secrets: inherit

  linux:
    name: Signed Linux payload
    needs: preflight
    uses: ./.github/workflows/linux-release.yml
    secrets: inherit

  finalize:
    name: Assemble, attest, verify, and publish once
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      VINTRACE_BUILD_SHA: ${{ github.sha }}
      VINTRACE_BUILD_REF: ${{ github.ref_name }}
      VINTRACE_BUILD_SOURCE_REF: ${{ github.ref }}
      VINTRACE_GITHUB_WORKFLOW_PATH: .github/workflows/release.yml
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      MCP_PUBLISHER_VERSION: "1.8.0"
      MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Reconfirm exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked JavaScript dependencies without runtime downloads
        run: npm ci --ignore-scripts

      - name: Download macOS build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Vintrace-macOS-Signed-Notarized
          path: ${{ runner.temp }}/vintrace-platforms/macos

      - name: Download Windows build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Vintrace-Windows-Signed-Azure
          path: ${{ runner.temp }}/vintrace-platforms/windows

      - name: Download Linux build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Vintrace-Linux-x64-Sigstore
          path: ${{ runner.temp }}/vintrace-platforms/linux

      - name: Revalidate and assemble all platform payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          npm run release:assemble -- \
            --macos "$RUNNER_TEMP/vintrace-platforms/macos" \
            --windows "$RUNNER_TEMP/vintrace-platforms/windows" \
            --linux "$RUNNER_TEMP/vintrace-platforms/linux" \
            --output dist \
            --manifest "$RUNNER_TEMP/vintrace-release-assembly.json" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY"

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Cryptographically reverify transferred platform evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:verify-platform-evidence -- \
            --macos "$RUNNER_TEMP/vintrace-platforms/macos" \
            --windows "$RUNNER_TEMP/vintrace-platforms/windows" \
            --linux "$RUNNER_TEMP/vintrace-platforms/linux" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF"

      - name: Generate one aggregate checksum and SBOM evidence set
        env:
          VINTRACE_SYFT_BIN: ${{ steps.syft.outputs.cmd }}
          VINTRACE_RELEASE_ASSEMBLY_MANIFEST: ${{ runner.temp }}/vintrace-release-assembly.json
        run: npm run release:artifacts

      - name: Attest aggregate subjects with SLSA provenance
        id: attest_slsa
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Preserve SLSA provenance bundle
        run: cp "${{ steps.attest_slsa.outputs.bundle-path }}" dist/vintrace-slsa-provenance.attestation.sigstore.json

      - name: Attest aggregate subjects with CycloneDX SBOM
        id: attest_cyclonedx
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/vintrace.cdx.json

      - name: Preserve CycloneDX attestation bundle
        run: cp "${{ steps.attest_cyclonedx.outputs.bundle-path }}" dist/vintrace-cyclonedx.attestation.sigstore.json

      - name: Attest aggregate subjects with SPDX SBOM
        id: attest_spdx
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/vintrace.spdx.json

      - name: Preserve SPDX attestation bundle
        run: cp "${{ steps.attest_spdx.outputs.bundle-path }}" dist/vintrace-spdx.attestation.sigstore.json

      - name: Keylessly sign every aggregate release subject
        env:
          VINTRACE_COSIGN_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
        run: npm run release:sign

      - name: Verify aggregate GitHub attestations and keyless signatures
        run: |
          npm run release:attest:verify
          node -e "require('./desktop/scripts/sign-release-artifacts.cjs').verifyCosignBundles({ identity: process.env.VINTRACE_COSIGN_IDENTITY })"
        env:
          GH_TOKEN: ${{ github.token }}
          VINTRACE_COSIGN_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"

      - name: Prepare immutable MCP Registry descriptor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vintrace-registry"
          args=()
          for asset in dist/Vintrace-{darwin,win32}-*.mcpb; do args+=(--asset "$asset"); done
          npm run mcp:registry:prepare -- --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/vintrace-registry/server.json" "${args[@]}"

      - name: Install verified official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          echo "MCP_PUBLISHER=$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_ENV"

      - name: Validate descriptor against the official Registry
        run: |
          "$MCP_PUBLISHER" validate "$RUNNER_TEMP/vintrace-registry/server.json"

      - name: Upload complete cross-platform release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vintrace-Cross-Platform-Release
          if-no-files-found: error
          path: dist/*

      - name: Upload validated MCP Registry descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vintrace-MCP-Registry-Descriptor
          if-no-files-found: error
          path: ${{ runner.temp }}/vintrace-registry/server.json

      - name: Reconfirm the remote tag has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"

      - name: Stage the complete release exactly once
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Vintrace ${{ inputs.release_tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*

      - name: Verify the complete staged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VINTRACE_COSIGN_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
        run: npm run release:verify -- --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --platform all --full --require-release-metadata --verify-signatures --allow-draft

      - name: Publish the verified release once
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG });
            if (!release.draft) throw new Error("Release was published before final verification.");
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: process.env.RELEASE_PRERELEASE === "true"
            });

      - name: Verify public downloads after publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VINTRACE_COSIGN_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
        run: npm run release:verify -- --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --platform all --full --require-release-metadata --verify-signatures

      - name: Authenticate the MCP publisher with GitHub OIDC
        run: |
          "$MCP_PUBLISHER" login github-oidc

      - name: Publish the immutable MCP Registry descriptor
        run: |
          "$MCP_PUBLISHER" publish "$RUNNER_TEMP/vintrace-registry/server.json"
