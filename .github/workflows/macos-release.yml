name: macOS Signed Build

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    env:
      VINTRACE_BUILD_SHA: ${{ github.sha }}
      VINTRACE_BUILD_REF: ${{ github.ref_name }}
      VINTRACE_BUILD_SOURCE_REF: ${{ github.ref }}
      VINTRACE_BUILD_PYTHON: python
      VINTRACE_REQUIRE_PYTHON_MINOR: "3.11"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install pinned Electron binary
        run: npm run electron:install

      - name: Install Python production dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # BRS-1: install from the pinned + hashed lock (reproducible/tamper-evident).
          python -m pip install --require-hashes -r requirements-production.lock.txt

      - name: Verify Electron and ONNX Runtime currency
        run: npm run test:dependency-currency

      - name: Audit macOS locked Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --require-hashes -r requirements-production.lock.txt

      - name: Run backend smoke tests
        env:
          CROSSAGE_FORCE_FALLBACK: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/pipeline_smoke.py
          python tests/clean_workspace_smoke.py
          python tests/accuracy_benchmark.py
          python tests/dataset_regression_gates.py
          python tests/model_lifecycle_units.py
          python benchmarks/run_model_lifecycle_evals.py --output "$RUNNER_TEMP/model-lifecycle.json"
          python tests/audio_intelligence_units.py
          python tests/mcp_redaction.py
          python tests/photo_source_adapters_units.py
          python tests/photo_source_service_units.py
          python tests/photo_source_api_units.py
          python tests/photo_source_scale.py
          python tests/vector_store_units.py

      - name: Validate release checks
        env:
          CROSSAGE_FORCE_FALLBACK: "1"
          PYTHONPATH: ${{ github.workspace }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run update:dry-run
          npm run test:release-signing-policy
          npm run release:check

      - name: Validate signing and notarization credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MACOS_CERTIFICATE" || { echo "Missing MACOS_CERTIFICATE" >&2; exit 1; }
          test -n "$MACOS_CERTIFICATE_PASSWORD" || { echo "Missing MACOS_CERTIFICATE_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_API_KEY_BASE64" || { echo "Missing APPLE_API_KEY_BASE64" >&2; exit 1; }
          test -n "$APPLE_API_KEY_ID_VALUE" || { echo "Missing APPLE_API_KEY_ID" >&2; exit 1; }
          test -n "$APPLE_API_ISSUER_VALUE" || { echo "Missing APPLE_API_ISSUER" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS installer
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          npm run build
          npm run build:backend
          VINTRACE_MODEL_LIFECYCLE_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-model-lifecycle
          VINTRACE_AUDIO_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-audio-intelligence
          VINTRACE_LOCAL_SYNC_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-local-sync
          VINTRACE_DEPENDENCY_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-dependency-currency
          VINTRACE_ENCRYPTION_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-workspace-encryption
          VINTRACE_ENCRYPTION_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-compliance
          VINTRACE_CONTENT_CREDENTIALS_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-content-credentials
          VINTRACE_MCP_TEST_EXECUTABLE="$PWD/backend-dist/crossage-backend/crossage-backend" npm run test:frozen-mobile-companion
          npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Smoke test packaged Electron 43 application
        run: npm run test:e2e:packaged

      - name: Build validated macOS MCPB package
        run: npm run mcp:bundle:package

      - name: Verify signature, notarization, and stapling
        run: |
          app="$(find dist -type d -name 'Vintrace.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          identity="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$identity" | grep -q '^Authority=Developer ID Application:'
          printf '%s\n' "$identity" | grep -Eq '^TeamIdentifier=[A-Z0-9]{10}$'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          for artifact in dist/*.dmg; do
            xcrun stapler validate "$artifact"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$artifact"
          done

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Generate standard SBOMs and release checksums
        env:
          VINTRACE_SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: npm run release:artifacts

      - name: Attest release subjects with SLSA provenance
        id: attest_slsa
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Preserve SLSA provenance bundle
        run: cp "${{ steps.attest_slsa.outputs.bundle-path }}" dist/vintrace-slsa-provenance.attestation.sigstore.json

      - name: Attest release subjects with CycloneDX SBOM
        id: attest_cyclonedx
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/vintrace.cdx.json

      - name: Preserve CycloneDX attestation bundle
        run: cp "${{ steps.attest_cyclonedx.outputs.bundle-path }}" dist/vintrace-cyclonedx.attestation.sigstore.json

      - name: Attest release subjects with SPDX SBOM
        id: attest_spdx
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/vintrace.spdx.json

      - name: Preserve SPDX attestation bundle
        run: cp "${{ steps.attest_spdx.outputs.bundle-path }}" dist/vintrace-spdx.attestation.sigstore.json

      - name: Keylessly sign every release subject
        env:
          VINTRACE_COSIGN_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/macos-release.yml@${{ github.ref }}"
        run: npm run release:sign

      - name: Verify GitHub-hosted provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          VINTRACE_GITHUB_WORKFLOW_PATH: .github/workflows/macos-release.yml
        run: npm run release:attest:verify

      - name: Validate packaged artifacts
        env:
          VINTRACE_PACKAGE_REQUIRED: "1"
          VINTRACE_PACKAGE_PLATFORM: "darwin"
        run: npm run package:check

      - name: Smoke test packaged backend sidecar
        env:
          CROSSAGE_FORCE_FALLBACK: "1"
          CROSSAGE_WORKSPACE: ${{ runner.temp }}/vintrace-workspace
        run: |
          backend="$PWD/backend-dist/crossage-backend/crossage-backend"
          if [ ! -x "$backend" ]; then
            backend="$(find "$PWD/backend-dist" -type f -name crossage-backend | head -n 1)"
          fi
          test -n "$backend"
          chmod +x "$backend"
          line="$(printf '\n' | "$backend" | tail -n 1)"
          python - <<'PY' "$line"
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload["ready"] is True
          assert len(payload["state"]["modelSetup"]["packages"]) >= 2
          PY

      - name: Smoke test packaged desktop app
        env:
          CROSSAGE_ALLOW_MULTI_INSTANCE: "1"
          CROSSAGE_FORCE_FALLBACK: "1"
        run: npm run test:e2e:packaged

      - name: Upload macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vintrace-macOS-Signed-Notarized
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS.txt*
            dist/vintrace.cdx.json
            dist/vintrace.spdx.json
            dist/vintrace-build-metadata.json
            dist/*.sigstore.json
            dist/Vintrace-darwin-*.mcpb
